services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jungle_wagering
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh

volumes:
  postgres-data:
